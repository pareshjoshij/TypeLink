name: 🐛 Bug Report
description: Create a report to help us improve TypeLink
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible so we can reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I type [X command], the terminal throws an unexpected error...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Go to '...'
        2. Type '...'
        3. Press Enter
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      description: What browser and operating system are you using?
      placeholder: e.g. Chrome 120 on macOS Sonoma
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Console Logs
      description: If applicable, drag and drop screenshots or paste browser console errors here.
    validations:
      required: false
